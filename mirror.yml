name: neovim
target:
  registry: ocx.sh
  repository: neovim

source:
  type: github_release
  owner: neovim
  repo: neovim
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# Pass 2 — Linux + darwin. windows staged below for Pass 3.
assets:
  # Anchored .tar.gz/.zip tails EXCLUDE the .appimage, .msi, .sha256 and
  # .zsync sidecars. The 0.11.0 floor avoids the legacy nvim-linux64 naming
  # (renamed to nvim-linux-<arch> in 0.10.4); 0.11.0..latest all use these.
  linux/amd64:
    - "^nvim-linux-x86_64\\.tar\\.gz$"
  linux/arm64:
    - "^nvim-linux-arm64\\.tar\\.gz$"
  darwin/amd64:
    - "^nvim-macos-x86_64\\.tar\\.gz$"
  darwin/arm64:
    - "^nvim-macos-arm64\\.tar\\.gz$"
  windows/amd64:
    - "^nvim-win64\\.zip$"
  # windows/arm64 intentionally omitted: nvim-win-arm64.zip first ships at
  # v0.11.7, so it is absent for v0.11.0..v0.11.6. With cascade + min 0.11.0
  # an arm64 pattern would fail those builds. Re-add with a min bump to 0.11.7
  # or a windows/arm64-only floor once the range is consistent.

asset_type:
  type: archive
  strip_components: 1   # wrapper dir nvim-<plat>/ → bin/nvim at content root

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "0.11.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 (GitHub's
    # macos-13 Intel pool is exhausted and deadlocks the push job).
    runner: macos-14
  darwin/arm64:
    runner: macos-14
  windows/amd64:
    runner: windows-latest
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
